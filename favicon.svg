<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ChessForge">
  <!-- The ChessForge mark: one glowing hexagon ring, on nothing. One file,
       copied byte for byte into both repos, in one cyan (#22E5FF) that is also
       the accent of the app and of the landing page. There is no second version
       of it anywhere, which is the whole point.

       No plate: it sits on whatever the tab bar is. The glow is layered strokes
       rather than an SVG filter, because filter support in favicon rendering is
       inconsistent across browsers, and a mark that loses its glow in the tab is
       not the same mark. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 20 L75.98 35 V65 L50 80 L24.02 65 V35 Z" stroke="#22E5FF" stroke-width="24" opacity=".09"/>
    <path d="M50 20 L75.98 35 V65 L50 80 L24.02 65 V35 Z" stroke="#22E5FF" stroke-width="17" opacity=".17"/>
    <path d="M50 20 L75.98 35 V65 L50 80 L24.02 65 V35 Z" stroke="#22E5FF" stroke-width="11" opacity=".34"/>
    <path d="M50 20 L75.98 35 V65 L50 80 L24.02 65 V35 Z" stroke="#22E5FF" stroke-width="7"/>
    <path d="M50 20 L75.98 35 V65 L50 80 L24.02 65 V35 Z" stroke="#BDF6FF" stroke-width="2.4" opacity=".9"/>
  </g>
</svg>
